<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter App</title>
    <link rel="stylesheet" href="style.css" />
    <!-- FontAweome CDN Link for Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <div class="wrapper">
      <header>Currency Converter</header>
      <form action="#">
        <div class="amount">
          <p>Enter Amount</p>
          <input type="number" value="1" class="enter-amount" min="0" step="any" />
        </div>
        <div class="drop-list">
          <div class="from">
            <p>From</p>
            <div class="from-drop-list select-box">
              <img class="flag-icon" src="assets/us.svg" alt="USD flag" />
              <select id="from-select">
                <option value="usd" data-flag="assets/us.svg" selected>USD</option>
                <option value="eur" data-flag="assets/eur.webp">EUR</option>
                <option value="vnd" data-flag="assets/vn.png">VND</option>
                <option value="aud" data-flag="assets/aud.png">AUD</option>
              </select>
            </div>
          </div>
          <div class="icon"><i class="fas fa-exchange-alt"></i></div>
          <div class="to">
            <p>To</p>
            <div class="to-drop-list select-box">
              <img class="flag-icon" src="assets/vn.png" alt="VND flag" />
              <select id="to-select">
                <option value="usd" data-flag="assets/us.svg">USD</option>
                <option value="eur" data-flag="assets/eur.webp">EUR</option>
                <option value="vnd" data-flag="assets/vn.png" selected>VND</option>
                <option value="aud" data-flag="assets/aud.png">AUD</option>
              </select>
            </div>
          </div>
        </div>
        <button id="get-exchange" type="submit">Get Exchange</button>
        <div class="amount">
          <p>Converted Amount</p>
          <input type="text" class="converted-amount" value="" readonly />
        </div>
      </form>
    </div>
  </body>
</html>
